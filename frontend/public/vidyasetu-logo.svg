<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" width="200" height="48" fill="none">
  <!-- VidyaSetu Emblem (Bridge + Knowledge Emblem) -->
  <g transform="translate(4, 4)">
    <!-- Base Shield / Foundation -->
    <rect x="0" y="0" width="40" height="40" rx="8" fill="#16233d"/>
    <!-- Golden Bridge Arch -->
    <path d="M6 28 C12 18, 28 18, 34 28" stroke="#b5772a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M10 28 C15 22, 25 22, 30 28" stroke="#f0e1cb" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 2" fill="none"/>
    <!-- Rising Sun / Knowledge Rays -->
    <circle cx="20" cy="18" r="4.5" fill="#b5772a"/>
    <path d="M20 7 L20 10 M12 12 L14 14 M28 12 L26 14" stroke="#f0e1cb" stroke-width="1.75" stroke-linecap="round"/>
    <!-- Pillar Foundations -->
    <rect x="7" y="27" width="3" height="6" rx="1" fill="#b5772a"/>
    <rect x="30" y="27" width="3" height="6" rx="1" fill="#b5772a"/>
    <rect x="18.5" y="27" width="3" height="6" rx="1" fill="#b5772a"/>
  </g>
  
  <!-- Typography "VidyaSetu" -->
  <text x="52" y="30" font-family="'Source Serif 4', Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#16233d" letter-spacing="-0.5">Vidya<tspan fill="#b5772a">Setu</tspan></text>
  <text x="53" y="41" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#5c3b15" letter-spacing="1.2">WELFARE INTELLIGENCE</text>
</svg>
